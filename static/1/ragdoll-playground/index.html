<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ragdoll Playground</title>
<style>
  html, body { margin: 0; height: 100%; background: #08080f; overflow: hidden; }
  body { font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #e8eaff; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; image-rendering: pixelated; outline: none; background: #08080f; }
  #status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  #status h1 { font-size: 22px; margin: 0; color: #f5a623; letter-spacing: 1px; }
  #bar { width: min(360px, 70vw); height: 10px; background: #1a1c33; border: 2px solid #46497e; }
  #bar i { display: block; height: 100%; width: 0; background: #f5a623; }
  #msg { color: #8086b8; min-height: 1.4em; max-width: 520px; white-space: pre-wrap; }
  #msg.err { color: #ff7676; }
  #hint { position: fixed; right: 8px; bottom: 6px; color: #8086b8; font-size: 12px; opacity: .7; pointer-events: none; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<div id="status"><h1>RAGDOLL PLAYGROUND</h1><div id="bar"><i></i></div><div id="msg">Loading...</div></div>
<div id="hint">F11 fullscreen</div>
<script src="config.js"></script>
<script src="rtc.js"></script>
<script src="audio.js"></script>
<script src="shell.js"></script>
<script async src="ragdoll_rs.js"></script>
</body>
</html>
