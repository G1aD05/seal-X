<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap"
    rel="stylesheet"
  >

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    #loading-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Pixelify Sans', cursive;
      font-size: 48px;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      white-space: pre-wrap;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div id="loading-text">LOADING...</div>

  <script>
    async function loadHTMLParts() {
      const loadingText = document.getElementById('loading-text');

      const owner = 'arcade-v';
      const repo = 'javascript2';
      const folder = 'minecraft_1.8';

      const baseURLs = [
        `https://cdn.jsdelivr.net/gh/${owner}/${repo}/${folder}/`,
        `https://raw.githubusercontent.com/${owner}/${repo}/main/${folder}/`,
        `https://fastly.jsdelivr.net/gh/${owner}/${repo}/${folder}/`,
        `https://testingcf.jsdelivr.net/gh/${owner}/${repo}/${folder}/`,
        `https://gcore.jsdelivr.net/gh/${owner}/${repo}/${folder}/`
      ];

      const parts = Array.from(
        { length: 2 },
        (_, i) => `eaglercraft1.8.8.html.part${i + 1}`
      );

      async function fetchPart(part, index) {
        let lastError;

        for (let i = 0; i < baseURLs.length; i++) {
          const url = baseURLs[i] + part;

          loadingText.textContent =
            `LOADING PART ${index + 1}/${parts.length}\n` +
            `SOURCE ${i + 1}/${baseURLs.length}...`;

          console.log(`[Part ${index + 1}] Trying:`, url);

          try {
            const response = await fetch(url, {
              cache: 'no-store'
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }

            const content = await response.text();

            if (!content.length) {
              throw new Error('Empty response');
            }

            console.log(`[Part ${index + 1}] Loaded from:`, url);

            return {
              content,
              baseURL: baseURLs[i]
            };

          } catch (error) {
            lastError = error;

            console.warn(
              `[Part ${index + 1}] Source failed: ${url}`,
              error
            );
          }
        }

        throw new Error(
          `Could not load ${part} from any source. ` +
          `Last error: ${lastError?.message || 'Unknown error'}`
        );
      }

      try {
        let combinedHTML = '';
        let gameBaseURL = baseURLs[0];

        for (let i = 0; i < parts.length; i++) {
          const result = await fetchPart(parts[i], i);

          combinedHTML += result.content;

          if (i === 0) {
            gameBaseURL = result.baseURL;
          }
        }

        loadingText.textContent = 'STARTING GAME...';

        // Set the base URL for relative game resources.
        const baseTag =
          `<base href="${gameBaseURL.replace(/"/g, '&quot;')}">`;

        if (/<head\b[^>]*>/i.test(combinedHTML)) {
          combinedHTML = combinedHTML.replace(
            /<head\b[^>]*>/i,
            match => match + '\n' + baseTag
          );
        } else {
          combinedHTML = baseTag + combinedHTML;
        }

        // Create the game iframe.
        const iframe = document.createElement('iframe');

        iframe.id = 'game';
        iframe.title = 'Minecraft 1.8.8';
        iframe.allow = 'autoplay; fullscreen; gamepad';
        iframe.allowFullscreen = true;

        // IMPORTANT:
        // Use srcdoc instead of a Blob URL.
        // This allows the unsandboxed iframe to inherit
        // the embedding document's origin.
        iframe.addEventListener('load', () => {
          console.log('Game document loaded.');
        });

        iframe.addEventListener('error', error => {
          console.error('Game iframe error:', error);
        });

        document.body.replaceChildren(iframe);

        iframe.srcdoc = combinedHTML;

        console.log('Game HTML assembled successfully.');
        console.log('Game base URL:', gameBaseURL);
        console.log('Using iframe.srcdoc instead of Blob URL.');

      } catch (error) {
        console.error('Error loading game:', error);

        loadingText.textContent =
          'FAILED TO LOAD GAME\n\n' + error.message;

        loadingText.style.fontSize = '24px';
        loadingText.style.whiteSpace = 'pre-wrap';
        loadingText.style.overflowWrap = 'anywhere';
      }
    }

    loadHTMLParts();
  </script>
</body>
</html>
