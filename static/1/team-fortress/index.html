<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TFC">

<base href="https://cdn.jsdelivr.net/gh/arcade-v/javascript2/team_fortress/">

<title>Team Fortress Classic</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎯%3C/text%3E%3C/svg%3E">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    height: 100%;
}

body {
    background: transparent;
    overflow: hidden;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
}

canvas {
    width: 100vw;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    display: none;
    touch-action: none;
}

#overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #0a0a08;
    transition: opacity 0.6s ease;
}

#overlay.gone {
    opacity: 0;
    pointer-events: none;
}

#overlay::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        180deg,
        rgba(6,6,5,0.45) 0%,
        rgba(6,6,5,0.15) 42%,
        rgba(6,6,5,0.82) 100%
    );
}

.panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0 clamp(24px, 6vw, 76px) clamp(28px, 7vh, 60px);
}

.logo {
    display: block;
    width: clamp(200px, 34vw, 320px);
    height: auto;
    image-rendering: -webkit-optimize-contrast;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.6));
}

.edition {
    margin-top: 8px;
    font-size: clamp(13px, 1.6vw, 16px);
    font-weight: 600;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: #cdb970;
    text-transform: uppercase;
}

.progress {
    display: flex;
    align-items: center;
    gap: 16px;
    max-width: 560px;
    margin-top: clamp(20px, 4vh, 34px);
}

.rail {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.16);
    overflow: hidden;
}

#bar {
    height: 100%;
    width: 0%;
    background: #d8b34a;
    transition: width 0.25s ease;
}

#pct {
    min-width: 4ch;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: #d8b34a;
    letter-spacing: 0.05em;
}

#status {
    margin-top: 12px;
    font-size: 13px;
    color: rgba(233, 226, 205, 0.72);
    min-height: 1.2em;
}

#status.err {
    color: #e0563c;
}

#maps {
    margin-top: 20px;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(233, 226, 205, 0.4);
}

#maps b {
    color: rgba(233, 226, 205, 0.75);
    font-weight: 600;
}

@media (prefers-reduced-motion: reduce) {
    #bar,
    #overlay {
        transition: none;
    }
}
</style>
</head>

<body>

<div id="overlay">
    <div class="panel">

        <img class="logo" id="logo" alt="Team Fortress">

        <div class="edition">
            Browser Edition
        </div>

        <div class="progress">
            <div class="rail">
                <div id="bar"></div>
            </div>

            <div id="pct">0%</div>
        </div>

        <div id="status">connecting…</div>
        <div id="maps"></div>

    </div>
</div>

<canvas id="canvas"></canvas>

<script>
(() => {
    "use strict";
    const PART_COUNT = 16;
    const PART_PREFIX = "assets/tfc-assets.part";
    
    const CDN_MIRRORS = [
        "https://cdn.jsdelivr.net/gh/arcade-v/javascript2/team_fortress/",
        "https://fastly.jsdelivr.net/gh/arcade-v/javascript2/team_fortress/",
        "https://gcore.jsdelivr.net/gh/arcade-v/javascript2/team_fortress/",
        "https://testingcf.jsdelivr.net/gh/arcade-v/javascript2/team_fortress/",
        "https://raw.githubusercontent.com/arcade-v/javascript2/refs/heads/main/team_fortress/",
        "https://raw.githack.com/arcade-v/javascript2/main/team_fortress/",
        "https://cdn.statically.io/gh/arcade-v/javascript2/team_fortress/"
    ];

    const APP_VERSION = "20260827-1";

    const overlay = document.getElementById("overlay");
    const bar = document.getElementById("bar");
    const pct = document.getElementById("pct");
    const status = document.getElementById("status");
    const logo = document.getElementById("logo");

    function progress(percent, message) {

        const p = Math.max(0, Math.min(100, percent));

        bar.style.width = p + "%";
        pct.textContent = Math.round(p) + "%";

        if (message) {
            status.textContent = message;
        }
    }

    function showError(error) {

        console.error("[TFC]", error);

        status.textContent =
            error?.message || String(error);

        status.classList.add("err");
    }

    async function fetchWithFallback(path, init = {}) {

        let lastError;

        for (let i = 0; i < CDN_MIRRORS.length; i++) {

            const url = CDN_MIRRORS[i] + path;

            try {

                console.log(
                    `[TFC CDN] Trying ${i + 1}/${CDN_MIRRORS.length}:`,
                    url
                );

                const response = await originalFetch(url, {
                    ...init,
                    cache: "force-cache"
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                console.log("[TFC CDN] Success:", url);

                return response;

            } catch (error) {

                lastError = error;

                console.warn(
                    `[TFC CDN] Mirror ${i + 1} failed:`,
                    error.message
                );
            }
        }

        throw new Error(
            `All CDN mirrors failed for ${path}: ${lastError?.message}`
        );
    }

    function loadImage(element, path) {

        let index = 0;

        function tryNext() {

            if (index >= CDN_MIRRORS.length) {
                console.error("[TFC] All image mirrors failed:", path);
                return;
            }

            const url = CDN_MIRRORS[index++] + path;

            element.src = url;
        }

        element.onerror = tryNext;

        tryNext();
    }

    loadImage(logo, "logo.png");

    // Background image fallback
    let backgroundIndex = 0;

    function loadBackground() {

        if (backgroundIndex >= CDN_MIRRORS.length) {
            return;
        }

        const url =
            CDN_MIRRORS[backgroundIndex++] + "loading-bg.jpg";

        const image = new Image();

        image.onload = () => {
            overlay.style.backgroundImage = `url("${url}")`;
        };

        image.onerror = loadBackground;

        image.src = url;
    }

    loadBackground();

    async function loadSplitZip() {

        progress(0, "loading assets…");

        const parts = new Array(PART_COUNT);

        let totalBytes = 0;
        let completed = 0;

        const downloads = Array.from(
            { length: PART_COUNT },
            async (_, index) => {

                const number = String(index + 1).padStart(3, "0");

                const path = PART_PREFIX + number;

                const response = await fetchWithFallback(path);

                const data = new Uint8Array(
                    await response.arrayBuffer()
                );

                if (!data.byteLength) {
                    throw new Error(`Empty asset part: ${path}`);
                }

                parts[index] = data;

                completed++;

                progress(
                    (completed / PART_COUNT) * 85,
                    `loading asset ${completed}/${PART_COUNT}…`
                );

                return data;
            }
        );

        await Promise.all(downloads);

        progress(88, "combining assets…");

        for (const part of parts) {
            totalBytes += part.byteLength;
        }

        console.log(
            "[TFC Split ZIP] Total size:",
            totalBytes,
            "bytes"
        );

        const combined = new Uint8Array(totalBytes);

        let offset = 0;

        for (const part of parts) {

            combined.set(part, offset);

            offset += part.byteLength;
        }

        // Verify ZIP signature
        if (
            combined[0] !== 0x50 ||
            combined[1] !== 0x4B
        ) {
            throw new Error(
                "Reconstructed file is not a valid ZIP archive."
            );
        }

        progress(96, "assets ready");

        console.log(
            "[TFC Split ZIP] Reconstructed:",
            totalBytes,
            "bytes"
        );

        return combined;
    }

    const originalFetch = window.fetch.bind(window);

    window.fetch = async function(input, init) {

        let url = "";

        if (typeof input === "string") {
            url = input;
        } else if (input instanceof Request) {
            url = input.url;
        } else if (input instanceof URL) {
            url = input.href;
        }

        if (url) {

            const absolute = new URL(
                url,
                document.baseURI
            );

            if (
                absolute.pathname.endsWith(
                    "/assets/tfc-assets.zip"
                )
            ) {

                console.log(
                    "[TFC Split ZIP] Intercepted:",
                    absolute.href
                );

                try {

                    const zip = await loadSplitZip();

                    return new Response(zip, {
                        status: 200,
                        statusText: "OK",
                        headers: {
                            "Content-Type": "application/zip",
                            "Content-Length": String(zip.byteLength)
                        }
                    });

                } catch (error) {

                    showError(error);

                    throw error;
                }
            }
        }

        return originalFetch(input, init);
    };

    async function loadApplication() {

        progress(0, "connecting to game servers…");

        try {

            await fetchWithFallback(
                "app.bundle.js?v=" + APP_VERSION
            ).then(async response => {

                const code = await response.text();

                const script = document.createElement("script");

                script.textContent = code;

                document.body.appendChild(script);
            });

            console.log("[TFC] Application loaded.");

        } catch (error) {

            showError(
                new Error(
                    "Failed to load application bundle: " +
                    error.message
                )
            );
        }
    }

    window.addEventListener("error", event => {

        console.error(
            "[TFC]",
            event.error || event.message
        );

        if (event.error?.message) {
            showError(event.error);
        }
    });

    window.addEventListener("unhandledrejection", event => {

        console.error(
            "[TFC] Unhandled promise rejection:",
            event.reason
        );

        showError(event.reason);
    });

    loadApplication();

})();
</script>
