name = "www"
main = "index.js"
compatibility_date = "2026-11-01"

# Built by build.mjs: public/ merged with static/ (games, tools, icons).
[assets]
directory = "./dist"
binding = "ASSETS"
# These two files are Tier 6 only: run the Worker first so index.js can check the login.
# (Needs Wrangler 4.20 or newer; the npm scripts use Wrangler 4.)
# /screenlink* also covers /screenlink and /screenlink/, which Cloudflare serves for screenlink.html too.
run_worker_first = ["/screenlink*", "/js/screenlink-ui.js"]

[vars]
# Your Render service. Change if the URL differs.
ORIGIN = "https://seal-server-rdhv.onrender.com"

# Keep-alive: Render's free tier sleeps after ~15 minutes without traffic, and static files
# are served by Cloudflare so they never wake it. This pings the server every 10 minutes
# (see scheduled() in index.js). Remove this block to turn the keep-alive off.
[triggers]
crons = ["*/10 * * * *"]
