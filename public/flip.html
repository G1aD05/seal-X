<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seal — Flip</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <style>
    /* ── FLIP (page-specific; everything else comes from style.css) ── */
    .flip-balance { justify-content: flex-start; }
    .flip-balance .amount { margin-right: auto; }

    .flip-day {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-2);
      text-align: right;
    }
    .flip-day b { color: var(--text); }
    .flip-day .up { color: var(--success); }
    .flip-day .down { color: var(--danger); }

    .flip-board {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
    }

    .flip-track {
      position: relative;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--bg-3);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 8px;
    }
    .flip-zone {
      position: absolute; inset: 0 auto 0 0;
      background: linear-gradient(90deg, var(--accent-dim), var(--accent));
      width: 0;
      transition: width 0.25s ease;
    }
    .flip-marker {
      position: absolute; top: -3px; bottom: -3px;
      width: 3px; margin-left: -1.5px;
      background: var(--text);
      box-shadow: 0 0 8px rgba(237,243,246,0.6);
      left: 0;
      opacity: 0;
    }
    .flip-marker.shown { opacity: 1; transition: left 0.55s cubic-bezier(.2,.8,.3,1); }

    .flip-scale {
      display: flex; justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px; color: var(--text-3);
      margin-bottom: 20px;
    }

    .flip-result {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 700;
      min-height: 1.4em;
      margin-bottom: 20px;
    }
    .flip-result .won { color: var(--success); }
    .flip-result .lost { color: var(--danger); }
    .flip-result .idle { color: var(--text-2); font-weight: 600; }
    .flip-result small {
      display: block; margin-top: 3px;
      font-family: var(--font-mono); font-weight: 400;
      font-size: 12px; color: var(--text-2);
    }

    .flip-label {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-2);
      margin-bottom: 10px;
    }

    .flip-stake-row {
      display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .flip-stake-row input {
      flex: 1 1 100px;
      min-width: 90px;
    }
    .flip-chip {
      background: var(--bg-3);
      color: var(--text);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-md);
      padding: 8px 14px;
      font-family: var(--font-mono);
      font-size: 13px; font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .flip-chip:hover { background: var(--bg-4); border-color: var(--accent-dim); }

    .flip-odds {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      margin-bottom: 24px;
    }
    .flip-odd {
      background: var(--bg-3);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-md);
      padding: 10px 8px;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .flip-odd small {
      display: block;
      font-family: var(--font-mono); font-weight: 400;
      font-size: 11px; color: var(--text-2);
      margin-top: 2px;
    }
    .flip-odd:hover { border-color: var(--accent-dim); }
    .flip-odd[aria-pressed="true"] {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent-2);
    }
    .flip-odd[aria-pressed="true"] small { color: var(--accent-2); opacity: 0.8; }

    .flip-note {
      font-size: 12px; color: var(--text-3);
      margin-top: 16px;
      line-height: 1.5;
    }

    .flip-log-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-2);
      margin: 28px 0 12px;
    }
    .flip-log { display: flex; flex-direction: column; gap: 6px; }
    .flip-log-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-family: var(--font-mono);
      font-size: 12px; color: var(--text-2);
    }
    .flip-log-row .up { color: var(--success); font-weight: 700; }
    .flip-log-row .down { color: var(--danger); font-weight: 700; }

    @media (prefers-reduced-motion: reduce) {
      .flip-marker.shown, .flip-zone { transition: none; }
    }
  </style>
</head>
<body>

  <!-- ===================== GLOBAL BANNER ===================== -->
  <div id="global-banner" class="global-banner hidden">
    <span id="banner-text"></span>
    <button class="banner-close" onclick="closeBanner()">✕</button>
  </div>

  <!-- ===================== AUTH MODAL ===================== -->
  <div id="auth-overlay" class="modal-overlay hidden">
    <div class="modal">
      <button class="modal-close" onclick="closeAuth()">✕</button>
      <div class="modal-tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>
      <div id="tab-login" class="tab-content active">
        <h2>Welcome back</h2>
        <input type="text" id="login-user" placeholder="Username" autocomplete="username">
        <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password">
        <p class="auth-error hidden" id="login-error"></p>
        <button class="btn-primary" onclick="login()">Sign In</button>
      </div>
      <div id="tab-register" class="tab-content">
        <h2>Create account</h2>
        <input type="text" id="reg-user" placeholder="Username" autocomplete="username">
        <input type="password" id="reg-pass" placeholder="Password" autocomplete="new-password">
        <input type="password" id="reg-pass2" placeholder="Confirm password" autocomplete="new-password">
        <p class="auth-error hidden" id="reg-error"></p>
        <button class="btn-primary" onclick="register()">Create Account</button>
      </div>
    </div>
  </div>

  <!-- ===================== UPDATE POPUP ===================== -->
  <div id="popup-overlay" class="modal-overlay hidden">
    <div class="modal">
      <button class="modal-close" onclick="dismissPopup()">✕</button>
      <h2 id="popup-title">Update</h2>
      <p class="popup-text" id="popup-text"></p>
    </div>
  </div>

  <!-- ===================== HEADER ===================== -->
  <header class="site-header">
    <div class="header-logo">
      <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit">
        <span class="logo-mark">⬡</span>
        <span class="logo-text">Seal</span>
      </a>
    </div>
    <div class="header-actions">
      <div id="user-info" class="user-chip hidden">
        <span class="user-avatar" id="user-avatar"></span>
        <span id="user-label"></span>
        <button class="chip-btn" onclick="logout()">Sign out</button>
        <button class="chip-btn admin-btn hidden" id="admin-btn" onclick="openAdmin()">Admin ⚙</button>
      </div>
      <button class="btn-ghost" id="auth-btn" onclick="openAuth()">Sign In</button>
      <button class="cloak-btn" id="cloak" title="Cloak window">⊡ Cloak</button>
    </div>
  </header>

  <!-- ===================== FLIP ===================== -->
  <main class="page-main">
    <div class="page-head">
      <h1 class="page-title">Flip</h1>
      <p class="page-sub">Stake Seals on a number. Beat the line, keep the multiplier.</p>
    </div>

    <div id="flip-signed-out" class="hidden">
      <p class="page-sub">Sign in to see your balance and play.</p>
      <button class="btn-primary" style="width:auto;margin-top:14px;" onclick="openAuth()">Sign In</button>
    </div>

    <div id="flip-signed-in">
      <div class="shop-balance flip-balance">
        <img src="images/seal-coin.png" alt="">
        <span class="amount" id="flip-seals">—</span>
        <span style="color:var(--text-2)">Seals</span>
        <div class="flip-day">
          Today: <b id="flip-net">0</b><br>
          <span id="flip-left"></span>
        </div>
      </div>

      <p class="form-error hidden" id="flip-error" style="margin-bottom:16px;"></p>

      <div class="flip-board">
        <div class="flip-track">
          <div class="flip-zone" id="flip-zone"></div>
          <div class="flip-marker" id="flip-marker"></div>
        </div>
        <div class="flip-scale"><span>0</span><span id="flip-line-label"></span><span>100</span></div>

        <p class="flip-result" id="flip-result"><span class="idle">Roll under the line to win.</span></p>

        <div class="flip-label">Stake</div>
        <div class="flip-stake-row">
          <input type="number" id="flip-bet" min="1" max="100" step="1" value="5" inputmode="numeric">
          <button class="flip-chip" data-bet="5" type="button">5</button>
          <button class="flip-chip" data-bet="25" type="button">25</button>
          <button class="flip-chip" data-bet="100" type="button">100</button>
        </div>

        <div class="flip-label">Payout</div>
        <div class="flip-odds" id="flip-odds"></div>

        <button class="btn-primary" id="flip-go">Place bet</button>

        <p class="flip-note" id="flip-note"></p>
      </div>

      <div id="flip-log-wrap" class="hidden">
        <div class="flip-log-title">Last few bets</div>
        <div class="flip-log" id="flip-log"></div>
      </div>
    </div>
  </main>

  <!-- ===================== NAV DOCK ===================== -->
  <nav class="dock">
    <a href="/" class="dock-item">
      <span class="dock-icon">⬡</span>
      <span class="dock-label">Home</span>
    </a>
    <a href="1.html" class="dock-item">
      <img src="images/controller.png" class="dock-img" alt="">
      <span class="dock-label">Games</span>
    </a>
    <a href="tools.html" class="dock-item">
      <img src="images/tools.png" class="dock-img tools-img" alt="">
      <span class="dock-label">Tools</span>
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/cookieSync.js"></script>
  <script src="js/main.js"></script>
  <script>
    let FLIP_STATE = null, FLIP_MULT = 2, FLIP_BUSY = false;
    const FLIP_HISTORY = [];

    function $(id) { return document.getElementById(id); }

    function flipChance(m) {
      const row = (FLIP_STATE.multipliers || []).find(x => x.multiplier === m);
      return row ? row.chance * 100 : 0;
    }

    function renderFlipOdds() {
      const wrap = $('flip-odds');
      wrap.innerHTML = '';
      (FLIP_STATE.multipliers || []).forEach(row => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'flip-odd';
        b.setAttribute('aria-pressed', String(row.multiplier === FLIP_MULT));
        b.innerHTML = row.multiplier + '×<small>' + (row.chance * 100).toFixed(1) + '% chance</small>';
        b.addEventListener('click', () => { FLIP_MULT = row.multiplier; renderFlipOdds(); renderFlipLine(); });
        wrap.appendChild(b);
      });
    }

    function renderFlipLine() {
      const pct = flipChance(FLIP_MULT);
      $('flip-zone').style.width = pct + '%';
      $('flip-line-label').textContent = 'win under ' + pct.toFixed(2);
    }

    function renderFlipState() {
      $('flip-seals').textContent = FLIP_STATE.seals.toLocaleString();
      const net = FLIP_STATE.netToday;
      const netEl = $('flip-net');
      netEl.textContent = (net > 0 ? '+' : '') + net + ' Seals';
      netEl.className = net < 0 ? 'down' : net > 0 ? 'up' : '';
      $('flip-left').textContent = FLIP_STATE.remainingToday + ' of ' + FLIP_STATE.limits.dailyWagerCap + ' Seals left today';
      const betInput = $('flip-bet');
      betInput.min = FLIP_STATE.limits.minBet;
      betInput.max = FLIP_STATE.limits.maxBet;
      $('flip-note').textContent = 'Stakes of ' + FLIP_STATE.limits.minBet + '\u2013' + FLIP_STATE.limits.maxBet +
        ' Seals, up to ' + FLIP_STATE.limits.dailyWagerCap +
        ' a day. Seals are play money \u2014 they\u2019re worth nothing outside Seal and can\u2019t be bought.';
      $('flip-go').disabled = FLIP_BUSY || FLIP_STATE.remainingToday <= 0 || FLIP_STATE.seals < FLIP_STATE.limits.minBet;
      updateWalletChip(FLIP_STATE.seals);
    }

    function renderFlipLog() {
      if (!FLIP_HISTORY.length) return;
      $('flip-log-wrap').classList.remove('hidden');
      $('flip-log').innerHTML = FLIP_HISTORY.slice(0, 6).map(h =>
        '<div class="flip-log-row"><span>' + h.bet + ' at ' + h.multiplier + '\u00d7 \u00b7 rolled ' + h.rollPercent.toFixed(2) +
        '</span><span class="' + (h.delta >= 0 ? 'up' : 'down') + '">' +
        (h.delta > 0 ? '+' : '') + h.delta + '</span></div>'
      ).join('');
    }

    function showFlipRoll(r) {
      const marker = $('flip-marker');
      marker.classList.add('shown');
      marker.style.left = r.rollPercent + '%';
      $('flip-result').innerHTML = r.won
        ? '<span class="won">Won ' + r.payout + ' Seals.</span><small>Rolled ' + r.rollPercent.toFixed(2) +
          ', needed under ' + r.winPercent.toFixed(2) + '.</small>'
        : '<span class="lost">Lost ' + r.bet + ' Seals.</span><small>Rolled ' + r.rollPercent.toFixed(2) +
          ', needed under ' + r.winPercent.toFixed(2) + '.</small>';
    }

    async function placeFlipBet() {
      if (FLIP_BUSY) return;
      const err = $('flip-error');
      err.classList.add('hidden');
      const bet = parseInt($('flip-bet').value, 10);
      if (!bet || bet < 1) { err.textContent = 'Enter a stake first.'; err.classList.remove('hidden'); return; }

      FLIP_BUSY = true;
      $('flip-go').disabled = true;
      try {
        const data = await API.placeFlipBet(bet, FLIP_MULT);
        FLIP_STATE = data.state;
        FLIP_HISTORY.unshift(data);
        showFlipRoll(data);
        renderFlipLog();
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('hidden');
      } finally {
        FLIP_BUSY = false;
        renderFlipState();
      }
    }

    async function loadFlip() {
      const signedIn = !!(CURRENT_USER && (CURRENT_USER.username || CURRENT_USER.user));
      $('flip-signed-in').classList.toggle('hidden', !signedIn);
      $('flip-signed-out').classList.toggle('hidden', signedIn);
      if (!signedIn) return;

      try {
        FLIP_STATE = await API.getFlipState();
      } catch (ex) {
        $('flip-error').textContent = ex.message;
        $('flip-error').classList.remove('hidden');
        return;
      }
      renderFlipOdds();
      renderFlipLine();
      renderFlipState();
    }

    document.querySelectorAll('[data-bet]').forEach(b => {
      b.addEventListener('click', () => {
        const max = FLIP_STATE ? FLIP_STATE.limits.maxBet : 100;
        $('flip-bet').value = Math.min(parseInt(b.dataset.bet, 10), max);
      });
    });
    $('flip-go').addEventListener('click', placeFlipBet);

    document.addEventListener('seal:user-ready', loadFlip);
    initSealPage();
  </script>
</body>
</html>
