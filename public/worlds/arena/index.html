<!DOCTYPE html><html><head><meta charset="utf-8"><title>Seal Arena</title>
<style>body{margin:0;background:#10151a;color:#cfe;font:13px system-ui;overflow:hidden}canvas{display:block;margin:auto;background:#182028}
#bar{position:fixed;top:6px;left:8px;display:flex;gap:8px;align-items:center}button{padding:4px 10px;border-radius:6px;border:0;background:#2b7;color:#012;cursor:pointer}</style></head>
<body><div id="bar"><span id="info">Connecting…</span><button id="buyTrail">Gold Trail (25)</button><button id="buyBoost">Boost (5)</button><span id="own"></span></div>
<canvas id="c" width="640" height="420"></canvas>
<script src="/js/seal-world-sdk.js"></script>
<script>
var c=document.getElementById('c'),g=c.getContext('2d'),me={x:320,y:210},others={},keys={},owned={},boostUntil=0,trail=[];
addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='b')useBoost();});addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0;});
function refresh(){SealWorld.products.owned().then(function(o){owned=o||{};document.getElementById('own').textContent='Boosts: '+(owned['speed-boost']||0)+' (press B)'+(owned['gold-trail']?' • Gold Trail on':'');});}
function useBoost(){if(Date.now()<boostUntil)return;SealWorld.products.consume('speed-boost',1).then(function(){boostUntil=Date.now()+8000;refresh();}).catch(function(){});}
function buy(id){SealWorld.products.buy(id).then(refresh).catch(function(e){if(e.message!=='Cancelled')alert(e.message);});}
document.getElementById('buyTrail').onclick=function(){buy('gold-trail')};document.getElementById('buyBoost').onclick=function(){buy('speed-boost')};
SealWorld.on('pos',function(m){others[m.from]=m.data;});
SealWorld.on('players',function(){var names={};SealWorld.players.forEach(function(p){names[p.name]=1});for(var k in others)if(!names[k])delete others[k];});
SealWorld.ready().then(function(){refresh();setInterval(function(){SealWorld.send('pos',{x:me.x|0,y:me.y|0,t:owned['gold-trail']?1:0});},66);requestAnimationFrame(loop);});
function dot(x,y,col,name){g.fillStyle=col;g.beginPath();g.arc(x,y,12,0,7);g.fill();g.fillStyle='#fff';g.textAlign='center';g.fillText(name,x,y-18);}
function loop(){var sp=Date.now()<boostUntil?4.5:2.5;
 if(keys.w||keys.arrowup)me.y-=sp;if(keys.s||keys.arrowdown)me.y+=sp;if(keys.a||keys.arrowleft)me.x-=sp;if(keys.d||keys.arrowright)me.x+=sp;
 me.x=Math.max(12,Math.min(628,me.x));me.y=Math.max(12,Math.min(408,me.y));
 if(owned['gold-trail']){trail.push({x:me.x,y:me.y});if(trail.length>25)trail.shift();}else trail=[];
 g.clearRect(0,0,640,420);trail.forEach(function(t,i){g.fillStyle='rgba(255,200,40,'+(i/40)+')';g.fillRect(t.x-3,t.y-3,6,6);});
 for(var k in others){var o=others[k];dot(o.x,o.y,o.t?'#fc3':'#6af',k);}
 dot(me.x,me.y,'#4e8',SealWorld.me||'you');
 document.getElementById('info').textContent=SealWorld.players.length+' player(s) • WASD / arrows'+(SealWorld.isHost?' • you are host':'');
 requestAnimationFrame(loop);}
</script></body></html>
