<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Down for maintenance</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a0a0b; color: #fafafa; padding: 24px;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 440px; text-align: center;
    background: #111113; border: 1px solid rgba(255,255,255,.1); border-radius: 22px; padding: 40px 30px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .icon { display: inline-flex; margin-bottom: 14px; color: #a1a1aa; }
  h1 { margin: 0 0 10px; font-size: 24px; font-weight: 600; letter-spacing: -.03em; }
  .msg { color: #a1a1aa; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin: 0 0 6px; }
  .status { color: #6f768a; font-size: 12px; margin-top: 18px; }
  details { margin-top: 26px; text-align: left; }
  summary { cursor: pointer; color: #6f768a; font-size: 12px; text-align: center; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  form { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  input, button {
    font: inherit; font-size: 14px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.12); background: #0a0a0b; color: #fafafa; outline: none;
  }
  input:focus { border-color: rgba(255,255,255,.45); }
  button { background: #fafafa; border-color: #fafafa; color: #0a0a0b; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .err { color: #ff7b7b; font-size: 12px; min-height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></svg></div>
    <h1>Down for maintenance</h1>
    <p class="msg">{{MESSAGE}}</p>
    <p class="status" id="status">This page reloads on its own when the site is back.</p>
    <details>
      <summary>Staff sign in</summary>
      <form id="login-form">
        <input id="u" type="text" placeholder="Username" autocomplete="username" required>
        <input id="p" type="password" placeholder="Password" autocomplete="current-password" required>
        <div class="err" id="err"></div>
        <button type="submit" id="go">Sign in</button>
      </form>
    </details>
  </div>
<script>
  // Flip back automatically as soon as maintenance ends.
  setInterval(function () {
    fetch('/api/maintenance', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.enabled === false) location.reload(); })
      .catch(function () {});
  }, 15000);

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var err = document.getElementById('err'), go = document.getElementById('go');
    err.textContent = ''; go.disabled = true;
    fetch('/api/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (res.ok) { location.reload(); return; }
        err.textContent = (res.d && res.d.error) || 'Sign-in failed.';
        go.disabled = false;
      })
      .catch(function () { err.textContent = 'Couldn\u2019t reach the server.'; go.disabled = false; });
  });
</script>
</body>
</html>
